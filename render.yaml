services:
  # ====================================================================
  # 1. FRONTEND (Vite + React Static Site)
  # ====================================================================
  - type: web
    name: internmatch-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_AUTH_SERVICE_URL
        sync: false
      - key: VITE_STUDENT_SERVICE_URL
        sync: false
      - key: VITE_COMPANY_SERVICE_URL
        sync: false
      - key: VITE_AI_SERVICE_URL
        sync: false

  # ====================================================================
  # 2. AUTH & IDENTITY SERVICE (Spring Boot 3.2 / Java 21)
  # ====================================================================
  - type: web
    name: internmatch-auth-service
    env: docker
    rootDir: microservices/auth-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "internmatch_db"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  # ====================================================================
  # 3. STUDENT SERVICE (Spring Boot 3.2 / Java 21)
  # ====================================================================
  - type: web
    name: internmatch-student-service
    env: docker
    rootDir: microservices/student-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "internmatch_db"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COMPANY_SERVICE_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: UNSTOP_API_KEY
        sync: false
      - key: UNSTOP_API_BASE_URL
        value: "https://unstop.com/api/public/opportunity/search-result"

  # ====================================================================
  # 4. COMPANY & RECRUITER SERVICE (Spring Boot 3.2 / Java 21)
  # ====================================================================
  - type: web
    name: internmatch-company-service
    env: docker
    rootDir: microservices/company-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: "internmatch_db"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: STUDENT_SERVICE_URL
        sync: false

  # ====================================================================
  # 5. AI, GROQ & LEETCODE SERVICE (Spring Boot 3.2 / Java 21)
  # ====================================================================
  - type: web
    name: internmatch-ai-service
    env: docker
    rootDir: microservices/ai-service
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_URL
        value: "https://api.groq.com/openai/v1/chat/completions"
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: LEETCODE_API_URL
        value: "https://alfa-leetcode-api.onrender.com/userProfile/"
