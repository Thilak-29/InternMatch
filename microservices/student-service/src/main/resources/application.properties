server.port=${PORT:8082}
spring.application.name=student-service

# Database Connection (supports full URL or discrete host/port/name components)
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:internmatch_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:root}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=5000

# Inter-service microservice URLs
company.service.url=${COMPANY_SERVICE_URL:http://localhost:8083}
ai.service.url=${AI_SERVICE_URL:http://localhost:8084}

# JWT Secret
jwt.secret=${JWT_SECRET:InternMatchSuperSecretKeyForJWTTokenGeneration2026SecureKeyWith256BitsLength}

# Frontend Origin
frontend.origin=${FRONTEND_URL:${FRONTEND_ORIGIN:http://localhost:5173}}

# Spring Boot Actuator Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Unstop API Credentials
unstop.api.key=${UNSTOP_API_KEY:}
unstop.api.url=${UNSTOP_API_BASE_URL:https://unstop.com/api/public/opportunity/search-result}



