server.port=${PORT:8083}
spring.application.name=company-service

# Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${DB_URL:jdbc:mysql://localhost:3306/internmatch_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${DB_USERNAME:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${DB_PASSWORD:root}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=1500

# Inter-service microservice URLs
student.service.url=${STUDENT_SERVICE_URL:http://localhost:8082}

# JWT Secret
jwt.secret=${JWT_SECRET:InternMatchSuperSecretKeyForJWTTokenGeneration2026SecureKeyWith256BitsLength}

# Frontend Origin
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

