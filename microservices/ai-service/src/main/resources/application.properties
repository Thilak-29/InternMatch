server.port=${PORT:8084}
spring.application.name=ai-service

# Groq Cloud API Configuration
groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
leetcode.api.url=${LEETCODE_API_URL:https://alfa-leetcode-api.onrender.com/userProfile/}

# JWT Secret
jwt.secret=${JWT_SECRET:InternMatchSuperSecretKeyForJWTTokenGeneration2026SecureKeyWith256BitsLength}

# Frontend Origin
frontend.origin=${FRONTEND_URL:${FRONTEND_ORIGIN:http://localhost:5173}}

# Spring Boot Actuator Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

