server.port=8081
spring.application.name=auth-service

# Local MySQL Workbench Database Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/internmatch_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=1500

# Flyway Configuration - Disabled for legacy Oracle 10g compatibility
spring.flyway.enabled=false

# JWT Secret
jwt.secret=${JWT_SECRET:InternMatchSuperSecretKeyForJWTTokenGeneration2026SecureKeyWith256BitsLength}

# Frontend Origin
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Gmail SMTP Configuration for OTP Authentication Emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:internmatch20@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

